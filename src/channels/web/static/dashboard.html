<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentiff.AI — System Health Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0f; color: #e0e0e0; padding: 20px; }
    h1 { font-size: 1.4rem; color: #fff; margin-bottom: 4px; }
    .subtitle { color: #888; font-size: 0.85rem; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .card { background: #151520; border: 1px solid #2a2a3a; border-radius: 8px; padding: 16px; }
    .card h2 { font-size: 1rem; color: #fff; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .card h2 .badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; font-weight: 500; }
    .badge-ok { background: #1a3a1a; color: #4ade80; }
    .badge-warn { background: #3a3a1a; color: #fbbf24; }
    .badge-fail { background: #3a1a1a; color: #f87171; }
    .badge-info { background: #1a2a3a; color: #60a5fa; }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th { text-align: left; color: #888; font-weight: 500; padding: 4px 8px; border-bottom: 1px solid #2a2a3a; }
    td { padding: 6px 8px; border-bottom: 1px solid #1a1a2a; }
    .status-ok { color: #4ade80; }
    .status-warn { color: #fbbf24; }
    .status-fail { color: #f87171; }
    .status-unknown { color: #888; }
    .summary-row { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
    .summary-item { background: #151520; border: 1px solid #2a2a3a; border-radius: 8px; padding: 12px 20px; min-width: 120px; }
    .summary-item .value { font-size: 1.8rem; font-weight: 700; color: #fff; }
    .summary-item .label { font-size: 0.75rem; color: #888; margin-top: 2px; }
    .refresh-btn { background: #2a2a3a; color: #e0e0e0; border: 1px solid #3a3a4a; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
    .refresh-btn:hover { background: #3a3a4a; }
    .timestamp { color: #666; font-size: 0.75rem; }
    .cron-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #1a1a2a; font-size: 0.82rem; }
    .cron-name { color: #e0e0e0; }
    .cron-schedule { color: #888; font-family: monospace; font-size: 0.78rem; }
    #error { color: #f87171; padding: 20px; display: none; }
  </style>
</head>
<body>
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 16px;">
    <div>
      <h1>System Health Dashboard</h1>
      <div class="subtitle">Agentiff.AI Infrastructure</div>
    </div>
    <button class="refresh-btn" onclick="loadAll()">Refresh</button>
  </div>

  <div class="summary-row" id="summary"></div>
  <div id="error"></div>
  <div class="grid" id="main-grid"></div>

  <script>
    // Use relative paths so this works behind any reverse proxy base path
    const BASE = window.location.pathname.replace(/\/dashboard\/?$/, '');
    const CREDS_URL = BASE + '/api/dashboard/credentials';
    const COMPLIANCE_URL = BASE + '/api/dashboard/compliance';
    const PIPELINES_URL = BASE + '/api/dashboard/pipelines';

    function statusClass(s) {
      s = (s || '').toLowerCase();
      if (s === 'ok' || s === 'passing' || s === 'pass') return 'status-ok';
      if (s === 'fail' || s === 'dead' || s === 'expired') return 'status-fail';
      if (s === 'warn' || s === 'refreshed' || s === 'unknown' || s === 'in_progress' || s === 'partial') return 'status-warn';
      return 'status-unknown';
    }

    function statusIcon(s) {
      s = (s || '').toLowerCase();
      if (s === 'ok' || s === 'passing' || s === 'pass') return '✓';
      if (s === 'fail' || s === 'dead' || s === 'expired') return '✗';
      return '~';
    }

    function badgeClass(s) {
      s = (s || '').toLowerCase();
      if (s === 'ok' || s === 'passing' || s === 'pass') return 'badge-ok';
      if (s === 'fail' || s === 'dead' || s === 'expired') return 'badge-fail';
      return 'badge-warn';
    }

    async function loadCredentials() {
      try {
        const resp = await fetch(CREDS_URL, {credentials: 'include'});
        if (!resp.ok) throw new Error('No credential data');
        const data = await resp.json();
        return data;
      } catch(e) {
        // Fallback: load from static file
        try {
          const resp = await fetch('/static/credential-health.json');
          if (resp.ok) return await resp.json();
        } catch(e2) {}
        return null;
      }
    }

    function renderCredentials(data) {
      if (!data) return '';
      const s = data.summary || {};
      const rows = (data.credentials || []).map(c => `
        <tr>
          <td>${c.name}</td>
          <td class="${statusClass(c.status)}">${statusIcon(c.status)} ${c.status.toUpperCase()}</td>
          <td>${c.expires || '-'}</td>
          <td style="color:#888">${c.notes || ''}</td>
        </tr>
      `).join('');

      return `
        <div class="card" style="grid-column: span 2;">
          <h2>Credentials & Keys
            <span class="badge ${s.fail > 0 ? 'badge-fail' : 'badge-ok'}">${s.ok}/${s.total} OK</span>
          </h2>
          <table>
            <tr><th>Credential</th><th>Status</th><th>Expires</th><th>Notes</th></tr>
            ${rows}
          </table>
          <div class="timestamp" style="margin-top:8px">Last check: ${data.timestamp || 'unknown'}</div>
        </div>
      `;
    }

    function renderPipelines() {
      const crons = [
        { name: 'Workflow Scout', schedule: 'Hourly 8am-8pm', group: 'workflow' },
        { name: 'Prototype & Queue', schedule: 'Hourly 9am-9pm', group: 'workflow' },
        { name: 'Reddit Outreach', schedule: '10am Mon-Fri', group: 'outreach' },
        { name: 'Book My Day', schedule: '10pm Sun-Thu', group: 'calendar' },
        { name: 'Content Planning', schedule: '10am Monday', group: 'content' },
        { name: 'Pipeline Monitor', schedule: 'Every 15min', group: 'monitor' },
        { name: 'Credential Check', schedule: '8am daily', group: 'monitor' },
        { name: 'Google OAuth Refresh', schedule: 'Every 50min', group: 'auth' },
        { name: 'Offsite Backup', schedule: '4pm daily', group: 'backup' },
        { name: 'Local DB Backup', schedule: '3pm daily', group: 'backup' },
      ];

      const rows = crons.map(c => `
        <div class="cron-row">
          <span class="cron-name">${c.name}</span>
          <span class="cron-schedule">${c.schedule}</span>
        </div>
      `).join('');

      return `
        <div class="card">
          <h2>Scheduled Routines <span class="badge badge-info">${crons.length} active</span></h2>
          ${rows}
        </div>
      `;
    }

    function renderServices() {
      const services = [
        { name: 'IronClaw Agent', port: 8080, type: 'core' },
        { name: 'Archon MCP', port: 8051, type: 'mcp' },
        { name: 'Notion MCP', port: 8063, type: 'mcp' },
        { name: 'Kiro MCP', port: 8069, type: 'mcp' },
        { name: 'Smartlead MCP', port: 8064, type: 'mcp' },
        { name: 'HubSpot MCP', port: 8066, type: 'mcp' },
        { name: 'Apollo MCP', port: 8067, type: 'mcp' },
        { name: 'Perplexity MCP', port: 8065, type: 'mcp' },
        { name: 'Kit MCP', port: 8068, type: 'mcp' },
        { name: 'Figma MCP', port: 8070, type: 'mcp' },
        { name: 'ZuckerBot MCP', port: 8072, type: 'mcp' },
        { name: 'Temporal API', port: 3101, type: 'infra' },
        { name: 'PostgreSQL', port: 5432, type: 'infra' },
        { name: 'Redis', port: 6379, type: 'infra' },
        { name: 'Ollama', port: 11434, type: 'infra' },
      ];

      const rows = services.map(s => `
        <div class="cron-row">
          <span class="cron-name">${s.name}</span>
          <span class="cron-schedule">:${s.port}</span>
        </div>
      `).join('');

      return `
        <div class="card">
          <h2>Services <span class="badge badge-info">${services.length}</span></h2>
          ${rows}
        </div>
      `;
    }

    function renderSummary(credData) {
      const s = credData?.summary || { ok: 0, fail: 0, warn: 0, total: 0 };
      return `
        <div class="summary-item">
          <div class="value" style="color: ${s.fail > 0 ? '#f87171' : '#4ade80'}">${s.ok}/${s.total}</div>
          <div class="label">Credentials OK</div>
        </div>
        <div class="summary-item">
          <div class="value">269</div>
          <div class="label">Tools Loaded</div>
        </div>
        <div class="summary-item">
          <div class="value">45</div>
          <div class="label">Skills Active</div>
        </div>
        <div class="summary-item">
          <div class="value">11</div>
          <div class="label">MCP Servers</div>
        </div>
        <div class="summary-item">
          <div class="value" style="color: #4ade80">TLSv1.3</div>
          <div class="label">DB Encryption</div>
        </div>
      `;
    }

    async function loadAll() {
      try {
        // Always render static sections first
        document.getElementById('main-grid').innerHTML =
          renderPipelines() +
          renderServices();

        // Then try to load credentials from API
        const credData = await loadCredentials();
        document.getElementById('summary').innerHTML = renderSummary(credData);
        if (credData) {
          document.getElementById('main-grid').innerHTML =
            renderCredentials(credData) +
            renderPipelines() +
            renderServices();
        }
      } catch(e) {
        console.error('Dashboard load error:', e);
        document.getElementById('error').style.display = 'block';
        document.getElementById('error').textContent = 'Error loading data: ' + e.message;
      }
    }

    loadAll();
    setInterval(loadAll, 300000); // refresh every 5 min
  </script>
</body>
</html>

[package]
name = "loom-render-tool"
version = "0.1.0"
edition = "2021"
description = "Compose a personalized Loom-style video from Drive audio + a website screenshot (WASM component)"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen = "0.41.0"

# ffmpeg-wasi ships PREBUILT WASM archives, so it cannot link for a native
# target -- `cargo test` on the host fails at link time with `undefined symbol:
# av_malloc`. Gating it to wasm32 keeps the pure logic (params, dimensions,
# codec selection) unit-testable on the host; the FFI itself is exercised
# in-sandbox by the runtime smoke test, which is the only place it can be.
[target.'cfg(target_arch = "wasm32")'.dependencies]
ffmpeg-wasi = "0.1"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
